services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: srm
      POSTGRES_USER: ${DATABASE_USER:-srm}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD no .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d srm']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
